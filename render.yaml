# =============================================================================
# 🚀 Render Blueprint — Study helper Doc
# -----------------------------------------------------------------------------
# Do Web Services (free tier):
#   1. studyhelper-site  → Node server (index.html + site/ + /api/*)
#   2. studyhelper-bot   → Python Telegram bot (bot/bot.py) + /healthz
#
# GitHub repo connect karne par Render yeh file padh kar dono services bana dega.
# Secrets (BOT_TOKEN, FIREBASE_*, ADMIN_*) dashboard me bharni hain — `sync: false`.
# =============================================================================
services:
  # ── 1) Website + API ─────────────────────────────────────────────────────
  - type: web
    name: studyhelper-site
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NODE_ENV
        value: production
      # PORT Render inject karta hai — kabhi manually set na karein
      - key: HOST
        value: 0.0.0.0
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # 0 = attached links kabhi expire nahi hote (bot ka auto-scan bhi yahi use karta hai)
      - key: TG_MEDIA_TOKEN_TTL_DAYS
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ── 2) Telegram bot (24×7 daemon, Web Service ke roop me) ────────────────
  - type: web
    name: studyhelper-bot
    runtime: python
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r bot/requirements.txt
    startCommand: python bot/bot.py
    healthCheckPath: /healthz
    autoDeploy: true
    numInstances: 1          # ⚠️ ek hi instance — 2 session = AUTH_KEY_DUPLICATED
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: PYTHONUNBUFFERED
        value: "1"
      # PORT Render inject karta hai (health server isi par bind hota hai)
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TG_SESSION_STRING
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      # ⚠️ website wali SAME secret — warna encrypted tokens decrypt nahi honge
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: OWNER_TG_ID
        sync: false
      - key: BOT_MAX_PARALLEL
        value: "1"
      - key: BOT_DOWNLOAD_DIR
        value: /tmp/shd_downloads
      - key: BOT_STATE_DB
        value: /tmp/shd_bot_state.db
      - key: BOT_HEALTH_TOKEN
        sync: false
      # 🔗 attached links kabhi expire na hon (website wali same policy)
      - key: TG_MEDIA_TOKEN_TTL_DAYS
        value: "0"
      # 🧲 AUTO-SCAN: kaun se channels padhne hain (10-15 ids, comma separated)
      #    @handle ya -100xxxxxxxxxx ya https://t.me/+invite
      #    Yahi list delivery-search ko bhi limit karti hai (baaki dialogs ignore).
      - key: BOT_SCAN_CHATS
        sync: false
      - key: BOT_SCAN_MIN_SCORE
        value: "75"
      - key: BOT_SCAN_MESSAGE_LIMIT
        value: "400"
